<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAHABALDICH MAIL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Затенённый фон флага Конго -->
    <div class="congo-bg"></div>

    <!-- Главный экран: Выбор листочков -->
    <div id="main-screen" class="container">
        <header>
            <h1>саха листы</h1>
            <div class="auth-panel">
                <div class="auth-buttons">
                    <button id="google-login-btn">Войти через Google</button>
                    <span id="user-info" class="hidden">йо <span id="username"></span>!</span>
                </div>
                <!-- Кнопки управления голосованием (Доступны всем без исключения) -->
                <div class="voting-controls" style="display: flex; gap: 10px; margin-top: 5px;">
                    <button id="join-voting-btn" style="background: #28a745;">Участвовать в голосовании</button>
                    <button id="skip-voting-btn" class="hidden" style="background: #f39c12;">Проголосовать за никого (Скип)</button>
                    <button id="leave-voting-btn" class="hidden" style="background: #7f8c8d;">Выйти из голосования</button>
                </div>
                <div id="voting-status" class="status-text" style="color: #fff; margin-top: 5px;"></div>
            </div>
        </header>

        <!-- Сетка 10 листов -->
        <div class="sheets-grid" id="sheets-container">
            <!-- 10 листов генерируются через JS -->
        </div>

        <!-- Секция голосования и Пьедестала -->
        <footer class="main-footer">
            <button id="pedestal-btn" title="Просмотр прошлых рисунков дня">🏆 Пьедестал</button>
            <div id="daily-winner-zone"></div>
        </footer>
    </div>

    <!-- Экран Редактора (Paint) -->
    <div id="editor-screen" class="hidden">
        <div class="editor-header">
            <button id="back-btn">← Назад к листам</button>
            <h2 id="current-sheet-title">Редактирование Листа #1</h2>
            <div id="admin-badge" class="hidden">⚙️ РЕЖИМ АДМИНА</div>
        </div>

        <div class="editor-workspace">
            <!-- Панель инструментов -->
            <div class="toolbar">
                <button class="tool-btn active" data-tool="pencil">✏️ Карандаш</button>
                <button class="tool-btn" data-tool="pencil-bucket">🧪 Заливка Карандаша</button>
                <button class="tool-btn" data-tool="eraser">🧽 Ластик (Обычный)</button>
                <hr>
                <button class="tool-btn" data-tool="pen">🖋️ Ручка</button>
                <button class="tool-btn" data-tool="pen-bucket">🧪 Заливка Ручки</button>
                <button class="tool-btn admin-only hidden" id="admin-eraser" data-tool="super-eraser">🧽 Специальный Ластик</button>
                <hr>
                <button class="tool-btn" data-tool="select">✂️ Выделение/Курсор</button>
                <div class="clipboard-actions hidden" id="clipboard-box">
                    <button id="copy-btn">Копировать</button>
                    <button id="paste-btn">Вставить</button>
                    <button id="delete-selection-btn">Удалить выдел.</button>
                </div>
                <hr>
                <div class="color-picker-wrapper">
                    <label for="color-picker">Цвет:</label>
                    <input type="color" id="color-picker" value="#000000">
                </div>
                <hr class="admin-only hidden">
                <button class="tool-btn admin-only hidden" id="admin-copy-sheet">📋 Копировать лист</button>
                <button class="tool-btn admin-only hidden red" id="admin-clear-sheet">🗑️ Очистить лист</button>
            </div>

            <!-- Холст -->
            <div class="canvas-container">
                <canvas id="paint-canvas" width="800" height="600"></canvas>
            </div>
        </div>
    </div>

    <!-- Модальное окно Пьедестала -->
    <div id="pedestal-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>🏆 История рисунков дня</h3>
            <div id="pedestal-gallery">
                <p>Тут пока пусто. Появится после завершения голосований</p>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
